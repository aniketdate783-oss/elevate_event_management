<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | Elevate Event Management</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card">
<h1>Create Account</h1><p class="sub">Join Elevate Event Management</p>
<form id="signupForm">
<label for="name">Full Name</label><input id="name" type="text" placeholder="Your name" required>
<label for="signupEmail">Email Address</label><input id="signupEmail" type="email" placeholder="you@example.com" required>
<label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
<label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="6" placeholder="At least 6 characters" required>
<label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="6" placeholder="Re-enter password" required>
<button type="submit">Create Account</button>
</form><p id="authMessage" class="auth-message" aria-live="polite"></p>
<p class="auth-note">Already have an account? <a href="login.html">Login</a></p>
<a class="auth-back" href="index.html">← Back to Home</a>
</main><script src="auth.js"></script></body></html>
